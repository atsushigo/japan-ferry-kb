      Hi! I answer questions about the Osaka–Busan (Pan Star) and Osaka/Kobe–Shanghai
      (Jianzhen) ferries: fares, cancellation, luggage and documents. The information
      comes from the official websites and may be out of date; please check the latest
      official notices.


      こんにちは！大阪―釜山（パンスター）と大阪／神戸―上海（鑑真号）の運賃、取消、手荷物、必要書類などにお答えします。情報は公式サイトをもとにしており、最新でない場合があります。公式の最新情報をご確認ください。'
